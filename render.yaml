# Render Blueprint. Update ALLOWED_ORIGINS with the real Vercel URL before deploy.
services:
  - type: web
    name: sentinel-ids-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://your-ids-frontend.vercel.app
      - key: MAX_BATCH_ROWS
        value: 5000
      - key: MAX_UPLOAD_BYTES
        value: 10485760
      - key: LOG_LEVEL
        value: INFO
